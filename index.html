<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Yoga Retreat</title>
    <meta name="description" content="Thank you to everyone that came to our 2026 retreat.">
    <meta name="theme-color" content="#8B7355">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background-color: #8B7355;
            color: #FFFFFF;
            font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        p {
            max-width: 44rem;
            margin: 0;
            font-size: clamp(1.875rem, 5vw, 2.75rem);
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <p>Thank you to everyone that came to our 2026 retreat.</p>
    </main>
</body>
</html>
